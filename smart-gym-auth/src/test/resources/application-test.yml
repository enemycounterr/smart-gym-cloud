spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-client-id
            client-secret: test-github-client-secret

jwt:
  secret: test-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 900000
  refresh-expiration-days: 7

management:
  tracing:
    enabled: false