server:
  port: 8000

spring:
  application:
    name: smart-gym-gateway

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  output:
    ansi:
      enabled: ALWAYS

  cloud:
    gateway:
      server:
        webflux:
          # 1. SETUP CORS (React)
          globalcors:
            add-to-simple-url-handler-mapping: true #COULD BE HELPFUL FOR FUTURE REACT APP (PREFLIGHT REQUESTS)
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:8000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          httpclient:
            connect-timeout: 2000
            response-timeout: 4s

          routes:
            # BLOCK ALL INTERNAL ENDPOINTS
            - id: block-internal-top
              uri: nohub://null
              predicates:
                - Path=/internal/**, /*/internal/**
              filters:
                - SetStatus=403


            # BUSINESS ROUTES
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/admin/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCB
                    fallbackUri: forward:/fallback/auth

                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 300ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"


            - id: core-service
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/zones/**, /api/v1/access/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: coreCB
                    fallbackUri: forward:/fallback/core

                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 300ms
                      factor: 2
                      basedOnPreviousValue: true
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            - id: client-service
              uri: ${CLIENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/clients/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: clientCB
                    fallbackUri: forward:/fallback/client

                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 300ms
                      factor: 2
                      basedOnPreviousValue: true

                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"


            - id: notification-service-admin
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/rabbitmq/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notificationCB
                    fallbackUri: forward:/fallback/notification

            # OPENAPI / SWAGGER AGGREGATION ROUTES
            - id: auth-docs
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/v3/api-docs/auth, /v3/api-docs/auth/**
              filters:
                - SetPath=/v3/api-docs
            - id: core-docs
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/v3/api-docs/core, /v3/api-docs/core/**
              filters:
                - SetPath=/v3/api-docs
            - id: client-docs
              uri: ${CLIENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/v3/api-docs/client, /v3/api-docs/client/**
              filters:
                - SetPath=/v3/api-docs
            - id: notification-docs
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/notification, /v3/api-docs/notification/**
              filters:
                - SetPath=/v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authCB:
        baseConfig: default
      coreCB:
        baseConfig: default
      clientCB:
        baseConfig: default
      notificationCB:
        baseConfig: default

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service (IAM)
        url: /v3/api-docs/auth
      - name: 2. Core Service (Access Control)
        url: /v3/api-docs/core
      - name: 3. Client Service
        url: /v3/api-docs/client
      - name: 4. Notification Service (DLQ Admin)
        url: /v3/api-docs/notification

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${spring.application.name:-}){cyan} %clr([%X{traceId:-},%X{spanId:-}]){magenta} %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
