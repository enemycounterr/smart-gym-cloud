spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: smart-gym-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show_sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,beans
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

application:
  client-service:
    url: ${CLIENT_SERVICE_URL:http://localhost:8082}

app:
  rabbitmq:
    client:
      exchange: "client.direct"
      queues:
        client-created: "access.client.created.queue"
        client-status: "access.client.status.queue"
      routing-keys:
        created: "client.event.created"
        status-changed: "client.event.status.changed"

    notification:
      exchange: "gym.events"
      routing-keys:
        access-registered: "gym.access.registered"

